name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "stella/**", release-readiness-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run tests
        shell: bash
        run: |
          mapfile -t test_files < <(find src tests -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.mjs' \) -print 2>/dev/null | sort)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found."
            exit 1
          fi
          npx tsx --test "${test_files[@]}"
      - name: Check trusted bootstrap script syntax
        run: node --check scripts/provision-initial-admin.mjs
      - name: Check authenticated production smoke-test syntax
        run: node --check scripts/smoke-test-hymns-taxis-production.mjs
      - name: Production build
        run: npm run build
